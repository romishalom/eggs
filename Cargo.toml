[package]
name = "eggs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Type-safe snapshots, diffs, patches and undo/redo history for Rust application state"
license = "MIT"
readme = "README.md"
keywords = ["snapshot", "undo", "redo", "diff", "patch"]
categories = ["data-structures", "rust-patterns"]
exclude = ["/.gitignore"]
authors = ["Romi Shalom<romishalom01@gmail.com>"]
repository = "https://github.com/romishalom/eggs"

[workspace]
members = ["eggs-derive"]

[features]
default = ["derive", "history"]
# Re-export `#[derive(Egg)]` from the `eggs-derive` proc-macro crate.
derive = ["dep:eggs-derive"]
# Serde support for `Snapshot<T>`, `EggPath` and `ChangeKind` (and derived snapshot types).
serde = ["dep:serde", "eggs-derive?/serde"]
# JSON convenience functions (`Snapshot::to_json` / `Snapshot::from_json`).
json = ["serde", "dep:serde_json"]
# Undo/redo history.
history = []
# Explicit change-tracking wrapper.
tracking = []
# Transactional edit wrapper.
transaction = []
# Snapshot repository abstractions.
store = []
# Thread-safe shared snapshots.
sync = []

[dependencies]
eggs-derive = { path = "eggs-derive", version = "0.1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
trybuild = ">=1.0.80, <1.0.100"

[[bench]]
name = "baseline"
harness = false

[[example]]
name = "snapshot"
required-features = ["derive"]

[[example]]
name = "history"
required-features = ["derive", "history"]

[[example]]
name = "patch"
required-features = ["derive"]

[[example]]
name = "transaction"
required-features = ["derive", "transaction"]
